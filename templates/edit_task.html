{% extends "base.html" %}

{% block title %}Редактировать задание - Помощь Рядом{% endblock %}

{% block extra_css %}
<style>
    .edit-task-container {
        max-width: 700px;
        margin: 0 auto;
        padding: var(--spacing-xl) var(--spacing-sm);
    }
    
    .edit-task-card {
        background-color: var(--bg);
        border: 1px solid var(--border);
        border-radius: var(--button-radius);
        padding: var(--spacing-lg);
        box-shadow: 0 4px 16px var(--shadow);
    }
    
    .edit-task-title {
        text-align: center;
        color: var(--primary-green);
        margin-bottom: var(--spacing-lg);
    }
    
    .form-group {
        margin-bottom: var(--spacing-md);
    }
    
    .form-label {
        display: block;
        font-weight: 600;
        margin-bottom: var(--spacing-xs);
        color: var(--text);
        font-size: 16px;
    }
    
    .form-input, .form-textarea, .form-select {
        width: 100%;
        padding: var(--spacing-sm);
        font-size: 16px;
        border: 2px solid var(--border);
        border-radius: 8px;
        transition: border-color 0.3s ease;
        font-family: inherit;
    }
    
    .form-input:focus, .form-textarea:focus, .form-select:focus {
        outline: none;
        border-color: var(--primary-green);
    }
    
    .form-textarea {
        min-height: 120px;
        resize: vertical;
    }
    
    .form-hint {
        font-size: 14px;
        color: var(--text-secondary);
        margin-top: var(--spacing-xs);
    }
    
    .urgency-options {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: var(--spacing-sm);
    }
    
    .urgency-option {
        position: relative;
    }
    
    .urgency-option input[type="radio"] {
        position: absolute;
        opacity: 0;
    }
    
    .urgency-label {
        display: block;
        padding: var(--spacing-sm);
        border: 2px solid var(--border);
        border-radius: 8px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    
    .urgency-option input[type="radio"]:checked + .urgency-label {
        border-color: var(--primary-green);
        background-color: rgba(76, 175, 80, 0.1);
        font-weight: 600;
    }
    
    .urgency-label:hover {
        background-color: var(--bg-secondary);
    }
    
    .form-actions {
        display: flex;
        gap: var(--spacing-sm);
        margin-top: var(--spacing-lg);
    }
    
    .btn-action {
        flex: 1;
    }
</style>
{% endblock %}

{% block content %}
<div class="edit-task-container">
    <div class="edit-task-card">
        <h1 class="edit-task-title">Редактировать задание</h1>
        
        <form method="POST" action="{{ url_for('tasks.edit_task', task_id=task.id) }}">
            <div class="form-group">
                <label for="title" class="form-label">Название задания *</label>
                <input 
                    type="text" 
                    id="title" 
                    name="title" 
                    class="form-input" 
                    value="{{ task.title }}"
                    required
                    minlength="5"
                    maxlength="200"
                >
            </div>
            
            <div class="form-group">
                <label for="description" class="form-label">Описание *</label>
                <textarea 
                    id="description" 
                    name="description" 
                    class="form-textarea" 
                    required
                    minlength="10"
                >{{ task.description }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="category" class="form-label">Категория *</label>
                <select id="category" name="category" class="form-select" required>
                    <option value="уборка" {% if task.category == 'уборка' %}selected{% endif %}>🧹 Уборка</option>
                    <option value="доставка" {% if task.category == 'доставка' %}selected{% endif %}>📦 Доставка</option>
                    <option value="мастер" {% if task.category == 'мастер' %}selected{% endif %}>🔧 Мастер на час</option>
                    <option value="сантехника" {% if task.category == 'сантехника' %}selected{% endif %}>🚰 Сантехника</option>
                    <option value="электрика" {% if task.category == 'электрика' %}selected{% endif %}>💡 Электрика</option>
                    <option value="няня" {% if task.category == 'няня' %}selected{% endif %}>👶 Няня</option>
                    <option value="репетитор" {% if task.category == 'репетитор' %}selected{% endif %}>📚 Репетитор</option>
                    <option value="переезд" {% if task.category == 'переезд' %}selected{% endif %}>🚚 Переезд</option>
                    <option value="сборка мебели" {% if task.category == 'сборка мебели' %}selected{% endif %}>🛠️ Сборка мебели</option>
                    <option value="компьютерная помощь" {% if task.category == 'компьютерная помощь' %}selected{% endif %}>💻 Компьютерная помощь</option>
                    <option value="другое" {% if task.category == 'другое' %}selected{% endif %}>📋 Другое</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="price" class="form-label">Цена (₽) *</label>
                <input 
                    type="number" 
                    id="price" 
                    name="price" 
                    class="form-input" 
                    value="{{ task.price }}"
                    required
                    min="1"
                    max="1000000"
                >
            </div>
            
            <div class="form-group">
                <label for="address" class="form-label">Адрес *</label>
                <input 
                    type="text" 
                    id="address" 
                    name="address" 
                    class="form-input" 
                    value="{{ task.address }}"
                    required
                    minlength="5"
                    maxlength="255"
                >
            </div>
            
            <div class="form-group">
                <label for="district" class="form-label">Район *</label>
                <select id="district" name="district" class="form-select" required>
                    <option value="Центральный" {% if task.district == 'Центральный' %}selected{% endif %}>Центральный</option>
                    <option value="Северный" {% if task.district == 'Северный' %}selected{% endif %}>Северный</option>
                    <option value="Южный" {% if task.district == 'Южный' %}selected{% endif %}>Южный</option>
                    <option value="Западный" {% if task.district == 'Западный' %}selected{% endif %}>Западный</option>
                    <option value="Восточный" {% if task.district == 'Восточный' %}selected{% endif %}>Восточный</option>
                    <option value="Ленинский" {% if task.district == 'Ленинский' %}selected{% endif %}>Ленинский</option>
                    <option value="Октябрьский" {% if task.district == 'Октябрьский' %}selected{% endif %}>Октябрьский</option>
                    <option value="Советский" {% if task.district == 'Советский' %}selected{% endif %}>Советский</option>
                    <option value="Железнодорожный" {% if task.district == 'Железнодорожный' %}selected{% endif %}>Железнодорожный</option>
                    <option value="Заречный" {% if task.district == 'Заречный' %}selected{% endif %}>Заречный</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Срочность *</label>
                <div class="urgency-options">
                    <div class="urgency-option">
                        <input 
                            type="radio" 
                            id="urgency_urgent" 
                            name="urgency" 
                            value="срочно"
                            {% if task.urgency == 'срочно' %}checked{% endif %}
                        >
                        <label for="urgency_urgent" class="urgency-label">⚡ Срочно</label>
                    </div>
                    
                    <div class="urgency-option">
                        <input 
                            type="radio" 
                            id="urgency_planned" 
                            name="urgency" 
                            value="планово"
                            {% if task.urgency == 'планово' %}checked{% endif %}
                        >
                        <label for="urgency_planned" class="urgency-label">📅 Планово</label>
                    </div>
                    
                    <div class="urgency-option">
                        <input 
                            type="radio" 
                            id="urgency_skills" 
                            name="urgency" 
                            value="навыки"
                            {% if task.urgency == 'навыки' %}checked{% endif %}
                        >
                        <label for="urgency_skills" class="urgency-label">🎯 Навыки</label>
                    </div>
                </div>
            </div>
            
            <div class="form-actions">
                <a href="{{ url_for('tasks.task_detail', task_id=task.id) }}" class="btn btn-secondary btn-action">
                    Отмена
                </a>
                <button type="submit" class="btn btn-primary btn-action">
                    Сохранить изменения
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
